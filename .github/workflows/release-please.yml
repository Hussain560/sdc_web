# Release automation on `main` (docs/07-engineering/git-workflow.md §2.1, steps 7 and 9).
# 1. release-please reads the Conventional Commits since the last tag and opens/updates a release PR that bumps
#    package.json and prepends CHANGELOG.md. Merging that PR creates the tag vX.Y.Z and the GitHub Release.
# 2. sync-develop opens a PR main -> develop so the release commit and tag reach develop (Innosoft "sync main").
# The first release (v1.0.0) is tagged by the owner at the cutover; the manifest already says 1.0.0.
# Enable it in exactly one repository: Settings -> Secrets and variables -> Actions -> Variables -> RELEASE_AUTOMATION = true.
# Repository setting needed: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Releases, tags and the changelog are made by ONE repository: the one where the variable RELEASE_AUTOMATION is 'true'.
    if: vars.RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-develop:
    name: Sync main into develop
    if: vars.RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    needs: release-please
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a sync pull request when develop is behind main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main"; exit 0
          fi
          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then echo "sync PR #$existing is already open"; exit 0; fi
          gh pr create --base develop --head main \
            --title "chore: sync main into develop" \
            --body "Brings the release commit and tag back into develop. Merge with a merge commit (not squash)."
