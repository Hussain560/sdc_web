# Fast gate on every pull request and push: format, lint, types, unit tests, build, database policies, PR title.
# The slow browser suites (visual regression and authenticated end-to-end) are NOT part of this gate: run them locally
# before a release (npm run e2e, npm run e2e:auth) or on demand from the Actions tab (workflow "E2E (manual)").
name: CI

on:
  pull_request:
    branches: [develop, main, production, 'release/**']
  push:
    branches: [develop, main, production, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

jobs:
  quality:
    name: Lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build

  db:
    name: Database policy tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase test db
      - name: Generated DB types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts

  commits:
    name: Conventional Commits (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: echo "${{ github.event.pull_request.title }}" | npx commitlint
