# Applies supabase/migrations to the hosted database that matches the branch (git-workflow.md §2).
#   develop, release/**  -> environment "dev"        (the Dev/Staging Supabase project)
#   production           -> environment "production" (the live project; protect it with required reviewers)
# Each environment holds the secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD.
# Migrations follow expand/migrate/contract, so the previous app version keeps working while this runs.
name: Deploy database

on:
  push:
    branches: [develop, 'release/**', production]
    paths: ['supabase/migrations/**', 'supabase/config.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Skip when the environment is not configured yet
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Supabase secrets are not set for this environment; nothing applied."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Link the project
        if: env.SKIP != '1'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: env.SKIP != '1'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: env.SKIP != '1'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
