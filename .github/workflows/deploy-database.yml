# Applies supabase/migrations to the hosted database that matches the branch (git-workflow.md §2).
#   develop, release/**  -> environment "dev"        (the Dev/Staging Supabase project)
#   production           -> environment "production" (the live project; protect it with required reviewers)
# Each environment holds ONE secret: SUPABASE_DB_URL, the Session pooler connection string of that project
# (Dashboard -> Connect -> Session pooler), with the database password inside. No access token is needed.
# Migrations follow expand/migrate/contract, so the previous app version keeps working while this runs.
name: Deploy database

on:
  push:
    branches: [develop, 'release/**', production]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Skip when the environment is not configured yet
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not set for this environment; nothing applied."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Show pending migrations
        if: env.SKIP != '1'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        if: env.SKIP != '1'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
